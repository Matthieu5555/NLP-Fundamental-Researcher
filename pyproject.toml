[project]
name = "constant-intern"
version = "0.1.0"
description = "Constant - Your Intern: AI-powered strategic company analysis with multi-agent debate, moat analysis, and SWOT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.30",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "networkx>=3.6",
    "matplotlib>=3.8.0",
    "weasyprint>=67.0",
    "jinja2>=3.1.6",
    "markdown>=3.10",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.10",
]
