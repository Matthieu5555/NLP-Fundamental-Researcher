[project]
name = "george-researcher"
version = "0.1.0"
description = "George - Your Financial Researcher: AI-powered strategic company analysis with multi-agent debate, moat analysis, and SWOT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.30",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.30.0",
    "watchdog>=6.0.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "fpdf2>=2.7.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "networkx>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
